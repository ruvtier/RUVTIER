<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ruvtier — Woven in silence — where every thread, cut, and touch is crafted with patience, perfected through precision</title>
  <style>
    body {
      margin: 0;
      font-family: 'Georgia', serif;
      background-color: #ffffff;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      background-image: url(''); /* Optional: silk texture or mist effect */
      background-size: cover;
      background-position: center;
    }
    h1 {
      font-size: 3em;
      color: #895129;
      letter-spacing: 2px;
    }
    p {
      max-width: 600px;
      font-size: 1.2em;
      margin: 20px auto;
    }
    input[type="email"] {
      padding: 10px;
      width: 250px;
      border: none;
      border-radius: 5px;

      padding: 10px 20px;
      background-color: #895129;
      border: none;

      border-radius: 5px;
      margin-left: 10px;
      cursor: pointer;
    }

<body>
  <h1>Ruvtier</h1>
  <p><em>“The Dawn of Timeless Elegance”</em></p>
  <p>A private universe of couture, fragrance, and billionaire experiences is taking form.</p>
  <p><strong>We craft for those who never need to prove anything</strong> | By Invitation Only</p>
  
  <form>
    <input type="email" placeholder="Enter your email" />
    <button type="submit">Notify Me</button>
  </form>
